<div class="bh-mobile-actions d-flex d-lg-none">
    <a
        class="bh-mobile-action"
        href="{% if request.user.is_authenticated %}{% url 'profile' %}{% else %}{% url 'account_login' %}{% endif %}"
        aria-label="{% if request.user.is_authenticated %}My Account{% else %}Sign In{% endif %}"
    >
        <svg class="bh-premium-icon bh-account-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <circle cx="16" cy="12" r="6" fill="currentColor"></circle>
            <path d="M4 28c0-6 5-10 12-10s12 4 12 10" fill="currentColor"></path>
        </svg>
    </a>
    <a
        class="bh-mobile-action bh-mobile-bag"
        href="{% url 'view_bag' %}"
        aria-label="Shopping bag, {{ product_count }} item{{ product_count|pluralize }}"
    >
        <svg class="bh-premium-icon bh-bag-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect x="6" y="10" width="20" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect>
            <path d="M10 10c0-4 3-6 6-6s6 2 6 6" fill="none" stroke="currentColor" stroke-width="2"></path>
            <text x="50%" y="60%" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="currentColor" letter-spacing="0.15em">BH</text>
        </svg>
        {% if product_count %}
        <span class="bh-bag-count" aria-hidden="true">{{ product_count }}</span>
        {% endif %}
    </a>
</div>
