<form class="form update-form" method="POST" action="{% url 'adjust_bag' item.item_id %}">
    {% csrf_token %}
    <div class="form-group">
        <div class="input-group quantity-control quantity-control--compact">
            <div class="input-group-prepend">
                <button class="decrement-qty btn btn-sm btn-black"
                    type="button" aria-label="Decrease quantity"
                    data-item_id="{{ item.item_id }}" id="decrement-qty_{{ item.item_id }}">
                    <span>
                        <i class="fas fa-minus fa-sm"></i>
                    </span>
                </button>
            </div>
            <input class="form-control form-control-sm qty_input" type="number"
                name="quantity" value="{{ item.quantity }}" min="1" max="99"
                data-item_id="{{ item.item_id }}"
                id="id_qty_{{ item.item_id }}">
            <div class="input-group-append">
                <button class="increment-qty btn btn-sm btn-black"
                    type="button" aria-label="Increase quantity"
                    data-item_id="{{ item.item_id }}" id="increment-qty_{{ item.item_id }}">
                    <span>
                        <i class="fas fa-plus fa-sm"></i>
                    </span>
                </button>
            </div>
            {% if item.product.has_sizes %}
                <input type="hidden" name="product_size" value="{{ item.size }}">
            {% endif %}
            {% if item.colour %}
                <input type="hidden" name="product_colour" value="{{ item.colour }}">
            {% endif %}
            {% if item.variant_key %}
                <input type="hidden" name="variant_key" value="{{ item.variant_key }}">
            {% endif %}
        </div>
    </div>
    <button class="update-link btn btn-link text-info p-0" type="submit">
        <small>Update</small>
    </button>
</form>
<form class="remove-form float-right" method="POST" action="{% url 'remove_from_bag' item.item_id %}">
    {% csrf_token %}
    {% if item.product.has_sizes %}
        <input type="hidden" name="product_size" value="{{ item.size }}">
    {% endif %}
    {% if item.colour %}
        <input type="hidden" name="product_colour" value="{{ item.colour }}">
    {% endif %}
    {% if item.variant_key %}
        <input type="hidden" name="variant_key" value="{{ item.variant_key }}">
    {% endif %}
    <button class="remove-item btn btn-link text-danger p-0" type="submit">
        <small>Remove</small>
    </button>
</form>
